[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2pod"
version = "0.1.0"
description = "Turn a scientific PDF into a two-person spoken discussion: remote LLM (OpenWebUI / OpenAI-compatible) writes the script, a local TTS model voices it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "openai>=1.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
paper2pod-server = "paper2pod.server:main"

# Third-party TTS plugins register themselves under this group, e.g.
#   [project.entry-points."paper2pod.tts"]
#   xtts = "my_pkg.xtts_backend:XTTSBackend"
[project.entry-points."paper2pod.tts"]
kokoro = "paper2pod.tts.kokoro_backend:KokoroBackend"
openai_http = "paper2pod.tts.openai_http:OpenAIHTTPBackend"
null = "paper2pod.tts.null_backend:NullBackend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper2pod = ["web/*.html", "web/*.css", "web/*.js"]
