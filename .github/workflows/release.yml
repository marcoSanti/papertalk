name: Release

# Two kinds of release, both: test, build the optimized app, publish a GitHub
# release with the zipped Papertalk.app, the source it was built from
# (Papertalk-<version>-source.tar.gz) and a SHA-256 for each.
#
#  - Stable: every push to main that bumps the VERSION file publishes a full
#    release, marked Latest, tagged v<VERSION>. Versioning is CI-driven: bump
#    the file, merge to main, and the release appears. No local tag tooling.
#    Only these builds get the official icon (CHANNEL=stable).
#  - Dev: every other push to main (i.e. a merged PR that didn't bump VERSION)
#    publishes a pre-release v<VERSION>-dev.<short commit>, so the newest merged
#    code is always downloadable. Only the newest few dev builds are kept. They
#    carry the "DEV" stripe icon, like local builds.
on:
  push:
    branches: [main]

permissions:
  contents: write   # create releases, upload assets, delete old dev builds

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  KEEP_DEV_RELEASES: 10

jobs:
  release:
    name: Release
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for the version compare and release notes

      - name: Decide the version
        id: version
        run: |
          BASE="$(../app.sh version)"
          SHORT="$(git rev-parse --short HEAD)"
          # A stable release (tag v<BASE>) exists already → this push isn't a bump.
          if git cat-file -e "v${BASE}" >/dev/null 2>&1; then
            KIND=dev
          else
            # The previous value of VERSION (before this push) vs now.
            PREV_REF="$(git log -1 --format=%H HEAD~1 -- VERSION 2>/dev/null)"
            PREV="$(git show "${PREV_REF}:VERSION" 2>/dev/null || echo "")"
            if [ "${PREV}" != "${BASE}" ]; then
              KIND=stable          # VERSION changed → publish the tag
            else
              KIND=dev
            fi
          fi
          if [ "$KIND" = "stable" ]; then
            VERSION="${BASE}"
          else
            VERSION="${BASE}-dev.${SHORT}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${KIND} build ${VERSION}"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            client/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-release-${{ runner.os }}-${{ hashFiles('client/Package.resolved', 'client/Package.swift') }}
          restore-keys: spm-release-${{ runner.os }}-

      - name: Test
        run: ../app.sh test

      - name: Build release
        # VERSION env overrides the file, so a dev build carries its -dev.<commit>
        # version in the app and the zip name. CHANNEL picks the icon: official
        # for stable, "DEV" stripe for dev.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.kind }}
        run: ../app.sh release

      - name: Checksum
        id: artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="dist/Papertalk-${VERSION}.zip"
          SRC="dist/Papertalk-${VERSION}-source.tar.gz"
          shasum -a 256 "$ZIP" | tee "${ZIP}.sha256"
          shasum -a 256 "$SRC" | tee "${SRC}.sha256"
          echo "zip=client/${ZIP}" >> "$GITHUB_OUTPUT"
          echo "src=client/${SRC}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          KIND: ${{ steps.version.outputs.kind }}
          SHORT: ${{ steps.version.outputs.short }}
          ZIP: ${{ steps.artifact.outputs.zip }}
          SRC: ${{ steps.artifact.outputs.src }}
        run: |
          {
            if [ "$KIND" = "dev" ]; then
              echo "**Development build** of \`main\` at commit ${SHORT}: the latest merged changes, not a"
              echo "stable release. Expect rough edges; for everyday use pick the latest non-pre-release."
              echo
            fi
            echo "Papertalk ${VERSION} for macOS 26 or later."
            echo
            echo "Download \`Papertalk-${VERSION}.zip\`, unzip it and move **Papertalk.app** to Applications."
            echo "The app is only ad-hoc signed, so the first time macOS may refuse to open it:"
            echo "right-click the app and choose **Open**."
            echo
            echo "\`Papertalk-${VERSION}-source.tar.gz\` is the source code this build was made from."
            echo
            echo "> This app is vibecoded. I had the need not the time. bugs are expected and help is appreciated"
          } > notes.md

          # gh release create makes the (lightweight) tag itself if missing, so a
          # stable bump needs no local tag command; the tag just never re-triggers
          # this workflow because tags aren't in the trigger list.
          if [ "$KIND" = "dev" ]; then
            gh release create "$TAG" "$ZIP" "${ZIP}.sha256" "$SRC" "${SRC}.sha256" \
              --target "$GITHUB_SHA" \
              --title "Papertalk ${VERSION}" \
              --notes-file notes.md \
              --prerelease
          else
            gh release create "$TAG" "$ZIP" "${ZIP}.sha256" "$SRC" "${SRC}.sha256" \
              --title "Papertalk ${VERSION}" \
              --notes-file notes.md \
              --generate-notes \
              --latest
          fi

      - name: Prune old dev builds
        if: steps.version.outputs.kind == 'dev'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Dev pre-releases, newest first; delete all but the newest few (and their tags).
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-dev\\."))) ] | sort_by(.createdAt) | reverse | .[].tagName' \
            | tail -n "+$((KEEP_DEV_RELEASES + 1))" \
            | while read -r old; do
                echo "Deleting old dev build ${old}"
                gh release delete "$old" --yes --cleanup-tag
              done