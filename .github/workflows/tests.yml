name: Tests

# Every pull request into main: run the test suite once, with code coverage.
# The coverage table goes on the run's summary page (no Codecov or other
# service), and the full report is attached to the run. The suite is fully
# mocked (no LLM, network, Keychain or voice models).
#
# Kept to what a PR needs:
#  - No app bundle: nothing would be uploaded, and the tests already compile
#    everything. Release builds are made (and published) by release.yml.
#  - No run on push to main: release.yml tests main before it publishes.
#  - Docs-only changes (Markdown) don't run it at all.
on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch / PR supersedes a run still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (macOS 26)
    # The package needs macOS 26 and Swift 6.2 (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            client/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('client/Package.resolved', 'client/Package.swift') }}
          # A PR can only restore caches saved on main, and on main only
          # release.yml runs (its cache holds the dependencies and a test build).
          restore-keys: |
            spm-${{ runner.os }}-
            spm-release-${{ runner.os }}-

      - name: Test with coverage
        run: ../app.sh coverage

      - name: Coverage summary
        if: always() && hashFiles('coverage/summary.md') != ''
        working-directory: .
        run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('coverage/summary.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/report.txt
            coverage/lcov.info
            coverage/summary.md
            coverage/totals.json
          retention-days: 30

  linux:
    name: Build and test (Linux)
    # The Linux port (AGENTS.md, "Linux port"): the same suite in the dev container
    # (Swift 6.2, Python services, GTK 4), plus the Python services' own tests.
    # Temporarily off: the Linux build and tests are paused. Delete this line to turn them back on
    # (and the matching ones in release.yml).
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build the dev image
        run: client/linux-dev/dev.sh build

      - name: Test (Swift suite and Python services)
        run: client/linux-dev/dev.sh test

      - name: Build the Linux app
        run: client/linux-dev/dev.sh app

      - name: Pack the AppImage
        run: client/linux-dev/dev.sh appimage

      - name: Smoke test the AppImage on plain Ubuntu
        run: client/linux-dev/appimage_smoke.sh

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: papertalk-linux-appimage
          path: |
            client/dist/Papertalk-*.AppImage
            client/dist/appimage-smoke.png
          retention-days: 14
