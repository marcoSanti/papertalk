name: Tests

# Every push to main and every pull request into main: build the app and run the
# test suite with code coverage. The coverage table goes on the run's summary
# page (no Codecov or other service), and the full report is attached to the run.
# The suite is fully mocked (no LLM, network, Keychain or voice models).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch / PR supersedes a run still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (macOS 26)
    # The package needs macOS 26 and Swift 6.2 (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history (git tooling; the build number is the commit hash)

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            client/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('client/Package.resolved', 'client/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Version
        run: ../app.sh version

      - name: Test with coverage
        run: ../app.sh coverage

      - name: Coverage summary
        if: always() && hashFiles('coverage/summary.md') != ''
        working-directory: .
        run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('coverage/summary.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/report.txt
            coverage/lcov.info
            coverage/summary.md
            coverage/totals.json
          retention-days: 30

      - name: Build the app bundle
        run: ../app.sh app

      - name: Check the storage server
        working-directory: .
        run: python3 -m py_compile server/storage_server.py

