name: Release

# Every push to main builds and tests the app, then publishes a GitHub release
# with the zipped Papertalk.app, the source it was built from
# (Papertalk-<version>-source.tar.gz) and a SHA-256 for each. A second job
# adds the Linux AppImage (Papertalk-<version>-x86_64.AppImage) to it.
#
# Which kind of release is decided by one rule: does the tag v<VERSION> exist?
#  - No  → Stable: a full release, marked Latest, tagged v<VERSION>, with the
#          official icon (CHANNEL=stable). Bump VERSION, merge to main, done.
#  - Yes → Dev: a pre-release v<VERSION>-dev.<short commit>, so the newest merged
#          code is always downloadable. Only the newest few dev builds are kept.
#          They carry the "DEV" stripe icon, like local builds.
# If a stable run fails before its release is created, the tag doesn't exist
# yet, so the next push to main simply tries the stable release again.
#
# Docs-only merges (Markdown) don't publish anything: the app would be the same.
# Run it by hand (Actions → Release → Run workflow) to retry a failed release.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write   # create releases, upload assets, delete old dev builds

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  KEEP_DEV_RELEASES: 10

jobs:
  release:
    name: Release
    # A manual run from another branch must not publish it.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    outputs:   # for the Linux job, which adds its AppImage to this release
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      kind: ${{ steps.version.outputs.kind }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags for the release notes

      - name: Decide the version
        id: version
        run: |
          BASE="$(../app.sh version)"
          SHORT="$(git rev-parse --short HEAD)"
          if [ -z "${BASE}" ]; then
            echo "::error::Could not read VERSION"; exit 1
          fi
          # Ask the remote directly, so a stale or missing local tag can't fool us.
          if git ls-remote --exit-code --tags origin "refs/tags/v${BASE}" >/dev/null 2>&1; then
            KIND=dev
            VERSION="${BASE}-dev.${SHORT}"
          else
            KIND=stable
            VERSION="${BASE}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}"    >> "$GITHUB_OUTPUT"
          echo "kind=${KIND}"       >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}"     >> "$GITHUB_OUTPUT"
          echo "Publishing ${KIND} build ${VERSION}"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            client/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-release-${{ runner.os }}-${{ hashFiles('client/Package.resolved', 'client/Package.swift') }}
          restore-keys: spm-release-${{ runner.os }}-

      - name: Test
        run: ../app.sh test

      - name: Build release
        # VERSION env overrides the file, so a dev build carries its -dev.<commit>
        # version in the app and the zip name. CHANNEL picks the icon: official
        # for stable, "DEV" stripe for dev.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.kind }}
        run: ../app.sh release

      - name: Checksum
        id: artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="dist/Papertalk-${VERSION}.zip"
          SRC="dist/Papertalk-${VERSION}-source.tar.gz"
          shasum -a 256 "$ZIP" | tee "${ZIP}.sha256"
          shasum -a 256 "$SRC" | tee "${SRC}.sha256"
          echo "zip=client/${ZIP}" >> "$GITHUB_OUTPUT"
          echo "src=client/${SRC}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          KIND: ${{ steps.version.outputs.kind }}
          SHORT: ${{ steps.version.outputs.short }}
          ZIP: ${{ steps.artifact.outputs.zip }}
          SRC: ${{ steps.artifact.outputs.src }}
        run: |
          {
            if [ "$KIND" = "dev" ]; then
              echo "**Development build** of \`main\` at commit ${SHORT}: the latest merged changes, not a"
              echo "stable release. Expect rough edges; for everyday use pick the latest non-pre-release."
              echo
            fi
            echo "Papertalk ${VERSION} for macOS 26 or later."
            echo
            echo "Download \`Papertalk-${VERSION}.zip\`, unzip it and move **Papertalk.app** to Applications."
            echo "The app is only ad-hoc signed, so the first time macOS may refuse to open it:"
            echo "right-click the app and choose **Open**."
            echo
            # No AppImage while the Linux job is off (see the linux job below).
            LINUX_BUILDS=false
            if [ "$LINUX_BUILDS" = true ]; then
              echo "On Linux, download \`Papertalk-${VERSION}-x86_64.AppImage\`, make it executable"
              echo "(\`chmod +x\`) and run it. It needs a desktop with GTK 4 (Ubuntu 22.04+, Fedora 36+ and alike)."
              echo
            fi
            echo "\`Papertalk-${VERSION}-source.tar.gz\` is the source code this build was made from."
            echo
            echo "> This app is vibecoded. I had the need not the time. bugs are expected and help is appreciated"
          } > notes.md

          # gh release create makes the tag itself (on the commit that was built),
          # so no local tag command is needed; the tag never re-triggers this
          # workflow because tags aren't in the trigger list.
          if [ "$KIND" = "dev" ]; then
            gh release create "$TAG" "$ZIP" "${ZIP}.sha256" "$SRC" "${SRC}.sha256" \
              --target "$GITHUB_SHA" \
              --title "Papertalk ${VERSION}" \
              --notes-file notes.md \
              --prerelease
          else
            gh release create "$TAG" "$ZIP" "${ZIP}.sha256" "$SRC" "${SRC}.sha256" \
              --target "$GITHUB_SHA" \
              --title "Papertalk ${VERSION}" \
              --notes-file notes.md \
              --generate-notes \
              --latest
          fi

      - name: Prune old dev builds
        if: steps.version.outputs.kind == 'dev'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Dev pre-releases, newest first; delete all but the newest few (and their tags).
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-dev\\."))) ] | sort_by(.createdAt) | reverse | .[].tagName' \
            | tail -n "+$((KEEP_DEV_RELEASES + 1))" \
            | while read -r old; do
                echo "Deleting old dev build ${old}"
                gh release delete "$old" --yes --cleanup-tag
              done

  linux:
    name: Linux AppImage
    # Adds Papertalk-<version>-x86_64.AppImage to the release the job above
    # made: the Linux tests, the AppImage (official icon for stable releases,
    # DEV ribbon for dev builds), a smoke test on plain Ubuntu, then upload.
    needs: release
    # Temporarily off, with the Linux job in tests.yml. Delete this line (and the
    # LINUX_BUILDS guard in the release notes) to publish the AppImage again.
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build the dev image
        run: client/linux-dev/dev.sh build

      - name: Test
        run: client/linux-dev/dev.sh test

      - name: Pack the AppImage
        env:
          VERSION: ${{ needs.release.outputs.version }}
          CHANNEL: ${{ needs.release.outputs.kind }}
        run: client/linux-dev/dev.sh appimage

      - name: Smoke test on plain Ubuntu
        run: client/linux-dev/appimage_smoke.sh

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          APPIMAGE="client/dist/Papertalk-${VERSION}-x86_64.AppImage"
          sha256sum "$APPIMAGE" | sed 's#  client/dist/#  #' | tee "${APPIMAGE}.sha256"
          gh release upload "$TAG" "$APPIMAGE" "${APPIMAGE}.sha256"
