<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>paper2pod — Your papers, as audio</title>
  <meta name="color-scheme" content="dark light" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>

  <div class="app">
    <header class="site-header">
      <div class="header-inner">
        <div class="header-left">
          <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <a class="brand" href="#top">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M12 3v2m0 14v2M5 12H3m18 0h-2M6.3 6.3 4.9 4.9m14.2 14.2 1.4 1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>
                <circle cx="12" cy="12" r="3.4"/>
              </svg>
            </span>
            <span class="brand-text">paper<em>2</em>pod</span>
          </a>
        </div>
        <span class="header-note" id="header-note">Local conversion</span>
      </div>
    </header>

    <!-- Backdrop for the mobile drawer -->
    <div class="drawer-backdrop" id="drawer-backdrop" aria-hidden="true"></div>

    <div class="app-body">
      <!-- ================= SIDEBAR ================= -->
      <aside class="sidebar" id="sidebar" aria-label="Library navigation">
        <div class="sidebar-inner">
          <!-- Persistent upload -->
          <div class="side-upload">
            <div id="dropzone" class="dz-mini" role="button" tabindex="0" aria-label="Upload a PDF">
              <input type="file" id="file-input" accept=".pdf,application/pdf" hidden />
              <span class="dz-ic" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V5m0 0 4 4m-4-4-4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
              </span>
              <div class="dz-meta">
                <p class="dz-title">Upload a PDF</p>
                <p class="dz-hint" id="dz-hint">Drag &amp; drop or click</p>
              </div>
            </div>
            <p class="dz-preview" id="dz-preview" hidden></p>
          </div>

          <!-- Views -->
          <nav class="side-nav" aria-label="Library views">
            <button class="side-link" data-view="all" type="button">
              <svg class="side-ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5a1 1 0 0 1 1-1h4l2 2h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></svg>
              <span class="side-label">All papers</span>
              <span class="side-count" data-count-for="all"></span>
            </button>
            <button class="side-link" data-view="fav" type="button">
              <svg class="side-ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3.8l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.9l5.8-.8z"/></svg>
              <span class="side-label">Favorites</span>
              <span class="side-count" data-count-for="fav"></span>
            </button>
          </nav>

          <!-- Tags -->
          <div class="side-section">
            <h4 class="side-heading">Tags</h4>
            <div id="tag-list" class="tag-list"></div>
          </div>
        </div>
      </aside>

      <!-- ================= CENTER: LIBRARY ================= -->
      <section class="library" id="top" aria-label="Paper library">
        <div class="lib-controls">
          <div class="search-box">
            <svg class="search-ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
            <input id="search-input" type="search" placeholder="Search title, filename, tags…" autocomplete="off" aria-label="Search papers" />
            <button class="search-clear" id="search-clear" type="button" aria-label="Clear search" hidden>
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </div>

          <select id="sort-select" class="sort-select" aria-label="Sort papers">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="title">Title</option>
            <option value="recent">Recently converted</option>
          </select>
        </div>

        <div class="status-filter" id="status-filter" role="group" aria-label="Filter by status">
          <button class="status-pill active" data-status="all" type="button">All</button>
          <button class="status-pill" data-status="running" type="button">Running</button>
          <button class="status-pill" data-status="done" type="button">Done</button>
          <button class="status-pill" data-status="error" type="button">Error</button>
        </div>

        <div class="lib-context" id="lib-context" hidden></div>

        <ul class="lib-list" id="lib-list" aria-live="polite"></ul>

        <div class="empty" id="empty" hidden>
          <div class="empty-orb" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M19 10a7 7 0 0 0-14 0M5 21h14M5 21 4 10m16 11 1-11M8 10l1-6m6 6 1-6"/></svg>
          </div>
          <h3 id="empty-title">Your library is empty</h3>
          <p id="empty-msg">Upload a PDF to start converting it into a podcast.</p>
        </div>
      </section>

      <!-- ================= DETAIL PANE ================= -->
      <aside class="detail" id="detail" aria-label="Paper details" hidden>
        <div class="detail-inner">
          <button class="icon-btn detail-close" id="detail-close" type="button" aria-label="Close details">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
          <div id="detail-body"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- ================= TOASTS ================= -->
  <div class="toast-region" id="toast-region" aria-live="assertive"></div>

  <!-- ================= TRANSCRIPT OVERLAY ================= -->
  <div class="overlay" id="transcript-overlay" hidden aria-hidden="true">
    <div class="overlay-inner" role="dialog" aria-modal="true" aria-label="Transcript">
      <header class="overlay-head">
        <h3 id="tx-title">Transcript</h3>
        <button class="icon-btn" id="tx-close" type="button" aria-label="Close transcript">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="overlay-body" id="tx-body"></div>
    </div>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
